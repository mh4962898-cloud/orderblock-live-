    function seededRand(seed) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < seed.length; i++) {
        h ^= seed.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return function () {
        h += 0x6D2B79F5;
        let t = Math.imul(h ^ (h >>> 15), 1 | h);
        t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    /* -------------------------------------------------------------------------
       D. CONVICTION SCORE, ORDER BLOCK & 5m CANDLE MODEL BUILDER
       ------------------------------------------------------------------------- */
    function computeConviction(pChange, volRatio, ltp, vwap, high, low, volume) {
      const absChg = Math.abs(pChange);
      const isBull = pChange >= 0;
      const hasRange = high > low && low > 0;
      const rawRangePos = hasRange ? Math.max(0, Math.min(1, (ltp - low) / (high - low))) : (isBull ? 0.8 : 0.2);
      const directionalPos = isBull ? rawRangePos : (1 - rawRangePos);
      const rangePct = hasRange ? ((high - low) / low) * 100 : absChg;

      if (!volume || volume <= 0) {
        // Graceful volume === 0 scoring: pChange magnitude (0-45) + Day High/Low proximity (0-35) + Intraday range % (0-20)
        const chgScore = Math.min(45, absChg * 6.5);
        const posScore = directionalPos * 35;
        const rngScore = Math.min(20, rangePct * 2.2);
        return Math.min(99, Math.max(38, Math.round(chgScore + posScore + rngScore)));
      }

      const vwapAligned = isBull ? (ltp >= vwap) : (ltp <= vwap);
      const chgScore = Math.min(45, absChg * 7.2);
      const volScore = Math.min(35, Math.max(0, (volRatio - 0.8) * 14.5));
      const vwapScore = vwapAligned ? 18 : 4;
      return Math.min(99, Math.max(40, Math.round(chgScore + volScore + vwapScore)));
    }

    function buildStockObject(raw, livePoints = null) {
      const sym = String(raw.symbol || '').trim().toUpperCase();
      const rand = seededRand(sym + '_NSE_OB_V4');
      const ltp = Number(raw.ltp || 100);
      const pChange = Number(raw.pChange || 0);
      const isBull = pChange >= 0;
      const prevClose = Number(raw.prevClose || (ltp / (1 + pChange / 100)));
      const rawHigh = Number(raw.high || 0);
      const rawLow = Number(raw.low || 0);
      const open = Number(raw.open || (prevClose * (1 + (isBull ? 0.002 : -0.002))));
      const hasRealVol = Number(raw.volume || 0) > 0;
      const volume = hasRealVol ? Number(raw.volume) : 0;
      const visualVolBase = hasRealVol ? volume : 1800000;
      const volRatio = Number(raw.volRatio || (hasRealVol ? (1.2 + Math.min(2.8, Math.abs(pChange) * 0.35)) : 0));
      const totalMove = ltp - open;

      // Build 72 intraday 5m candles anchored cleanly within dayHigh / dayLow
      const numBars = 72;
      const ob1Start = 4, ob1End = 11;
      const ob2Start = 30, ob2End = 39;
      const candles = [];
      const simTrajectory = [];
      let prevC = open;
      let cumPV = 0, cumV = 0;

      for (let i = 0; i < numBars; i++) {
        let prog;
        if (i < ob1Start) prog = (i / ob1Start) * 0.14;
        else if (i <= ob1End) prog = 0.14 + ((i - ob1Start) / (ob1End - ob1Start)) * 0.05;
        else if (i < ob2Start) prog = 0.19 + ((i - ob1End) / (ob2Start - ob1End)) * 0.37;
        else if (i <= ob2End) prog = 0.56 + ((i - ob2Start) / (ob2End - ob2Start)) * 0.05;
        else prog = 0.61 + ((i - ob2End) / (numBars - 1 - ob2End)) * 0.39;

        const inOb = (i >= ob1Start && i <= ob1End) || (i >= ob2Start && i <= ob2End);
        const amp = Math.max(Math.abs(totalMove), ltp * 0.006);
        const noise = (rand() - 0.5) * 2 * amp * (inOb ? 0.018 : 0.045);
        let c = (i === numBars - 1) ? ltp : open + totalMove * prog + noise;
        if (rawHigh > 0 && rawLow > 0 && rawHigh >= rawLow) {
          c = Math.max(rawLow, Math.min(rawHigh, c));
        }
        const o = prevC;
        let h = Math.max(o, c) + amp * (0.01 + rand() * 0.022);
        let l = Math.min(o, c) - amp * (0.01 + rand() * 0.022);
        if (rawHigh > 0 && rawLow > 0 && rawHigh >= rawLow) {
          h = Math.min(rawHigh, h);
          l = Math.max(rawLow, l);
        }
        const isImpulse = (i >= 12 && i <= 17) || (i >= 40 && i <= 46);
        const v = Math.round((visualVolBase / numBars) * (isImpulse ? (1.9 + rand() * 1.3) : (0.55 + rand() * 0.85)));

        cumPV += ((h + l + c) / 3) * v;
        cumV += v;
        const barVwap = cumPV / Math.max(1, cumV);

        candles.push({ time: BASE_5M_LABELS[i], o, h, l, c, v, vwap: barVwap });
        simTrajectory.push(((c - prevClose) / Math.max(0.01, prevClose)) * 100);
        prevC = c;
      }

      const dayHigh = rawHigh > 0 ? Math.max(rawHigh, ltp) : Math.max(...candles.map(b => b.h));
      const dayLow = rawLow > 0 ? Math.min(rawLow, ltp) : Math.min(...candles.map(b => b.l));
      const vwap = Number(raw.vwap || (dayHigh > dayLow ? (dayHigh + dayLow + ltp) / 3 : candles[candles.length - 1].vwap));

      // Intraday range metrics (especially informative when NSE MCP returns volume === 0)
      const rangePos = (dayHigh > dayLow) ? Math.max(0, Math.min(1, (ltp - dayLow) / (dayHigh - dayLow))) : (isBull ? 1 : 0);
      const directionalPosPct = Math.round((isBull ? rangePos : (1 - rangePos)) * 100);
      const rangePct = dayLow > 0 ? ((dayHigh - dayLow) / dayLow) * 100 : Math.abs(pChange);
      const strengthLabel = hasRealVol
        ? `${volRatio.toFixed(2)}x VOL`
        : `STR ${directionalPosPct}% • RNG ${rangePct.toFixed(1)}%`;
      const compactStrength = hasRealVol
        ? `${volRatio.toFixed(2)}x VOL`
        : `RNG ${directionalPosPct}%`;

      // Compute Morning OB & Midday OB from OHLC/VWAP structure
      const ob1Slice = candles.slice(ob1Start, ob1End + 1);
      const ob2Slice = candles.slice(ob2Start, ob2End + 1);
      const ob1 = {
        startIdx: ob1Start,
        endIdx: ob1End,
        low: Math.min(...ob1Slice.map(b => b.l)),
        high: Math.max(...ob1Slice.map(b => b.h)),
        label: 'MORNING OB'
      };
      const ob2 = {
        startIdx: ob2Start,
        endIdx: ob2End,
        low: Math.min(...ob2Slice.map(b => b.l)),
        high: Math.max(...ob2Slice.map(b => b.h)),
        label: 'MIDDAY OB'
      };

      // Key Institutional Levels derived from dayHigh, dayLow, and LTP with 1:2 R:R
      const intraSpan = Math.max(dayHigh - dayLow, ltp * 0.012);
      const riskDist = Math.max(Math.abs(ltp - (isBull ? ob2.low : ob2.high)), intraSpan * 0.28);
      const support1 = isBull ? Math.max(dayLow, ltp - riskDist) : (ltp - riskDist * 1.2);
      const resistance1 = isBull ? (ltp + riskDist * 1.0) : Math.min(dayHigh, ltp + riskDist);
      const resistance2 = isBull ? (ltp + riskDist * 2.0) : (ltp - riskDist * 2.0);
      const vwapDiffPct = ((ltp - vwap) / Math.max(0.01, vwap)) * 100;
      const conviction = computeConviction(pChange, volRatio, ltp, vwap, dayHigh, dayLow, volume);

      let trajectory = simTrajectory;
      if (livePoints && livePoints.length >= 2) {
        trajectory = livePoints.map(pt => pt.pct);
      }

      return {
        symbol: sym,
        sector: normalizeSector(raw.sector, sym),
        ltp,
        open,
        high: dayHigh,
        low: dayLow,
        prevClose,
        pChange,
        pointChange: ltp - prevClose,
        volume,
        hasRealVol,
        volRatio,
        rangePos,
        directionalPosPct,
        rangePct,
        strengthLabel,
        compactStrength,
        vwap,
        vwapDiffPct,
        isBull,
        conviction,
        buildUp: isBull ? 'LONG BUILD-UP' : 'SHORT BUILD-UP',
        support1,
        resistance1,
        resistance2,
        rr: '1:2',
        ob1,
        ob2,
        candles,
        trajectory
      };
    }

    function normalizeSector(sec, symbol = '') {
      if (symbol && SYMBOL_SECTOR_MAP[symbol]) {
        return SYMBOL_SECTOR_MAP[symbol];
      }
      if (!sec) return 'OTHER';
      const u = String(sec).toUpperCase().trim();
      if (u.includes('BANK') || u.includes('FIN')) return 'BANKING';
      if (u.includes('CAP') || u.includes('BROK') || u.includes('EXCH')) return 'CAP MKTS';
      if (u.includes('IT') || u.includes('TECH') || u.includes('SOFT')) return 'IT';
      if (u.includes('REAL') || u.includes('INFRA')) return 'REALTY';
      if (u.includes('PHARM') || u.includes('HEALTH')) return 'PHARMA';
      if (u.includes('AUTO') || u.includes('DEF') || u.includes('METAL')) return 'AUTO';
      return CORE_SECTORS.includes(u) ? u : 'OTHER';
    }

        return secOk && qOk;
      });

    function renderSectorPills() {
      const bar = document.getElementById('sectorBar');
      const hasOther = state.stocks.some(s => s.sector === 'OTHER');
      const sectorsToShow = hasOther ? [...CORE_SECTORS, 'OTHER'] : CORE_SECTORS;

      bar.innerHTML = sectorsToShow.map(sec => {
        const subset = sec === 'ALL' ? state.stocks : state.stocks.filter(s => s.sector === sec);
        const avg = subset.length ? subset.reduce((acc, s) => acc + s.pChange, 0) / subset.length : 0;
        const activeCls = state.activeSector === sec ? 'active' : '';
        const chgCls = avg >= 0 ? 'sec-up' : 'sec-dn';
        const chgTxt = sec === 'ALL' ? '' : `<span class="sec-chg ${chgCls}">${avg >= 0 ? '+' : ''}${avg.toFixed(1)}%</span>`;
        return `<button class="sector-pill ${activeCls}" data-sector="${sec}" type="button">${sec}${chgTxt}</button>`;
      }).join('');

      bar.querySelectorAll('.sector-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeSector = btn.dataset.sector;
          renderAll();
        });
      });
    }

    function updateBreadthReadout() {
      const subset = state.activeSector === 'ALL'
        ? state.stocks
        : state.stocks.filter(s => s.sector === state.activeSector);
      const bullCount = subset.filter(s => s.isBull).length;
      const bearCount = subset.length - bullCount;
      document.getElementById('breadthBull').textContent = bullCount;
      document.getElementById('breadthBear').textContent = bearCount;
      document.getElementById('universeMeta').textContent = `${state.stocks.length} TRACKED NSE STOCKS`;
    }

    /* -------------------------------------------------------------------------
       F. INLINE SVG SPARKLINES & MINI ORDER BLOCK CANVAS
       ------------------------------------------------------------------------- */
    function buildSparklineSVG(stock) {
      const pts = stock.trajectory;
      const w = 100, h = 24;
      const min = Math.min(...pts);
      const max = Math.max(...pts);
      const span = Math.max(max - min, 0.01);
      const coords = pts.map((v, i) => {
        const x = (i / Math.max(1, pts.length - 1)) * w;
        const y = h - 2 - ((v - min) / span) * (h - 4);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      const stroke = stock.isBull ? '#00e676' : '#ff3b5c';
      const fill = stock.isBull ? 'rgba(0,230,118,0.16)' : 'rgba(255,59,92,0.16)';
      return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:24px;display:block;" preserveAspectRatio="none">
        <polygon points="0,${h} ${coords} ${w},${h}" fill="${fill}" />
        <polyline points="${coords}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round" />
      </svg>`;
    }

    function drawMiniPickCanvas(canvas, stock) {
      if (!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const W = canvas.clientWidth || 160;
      const H = canvas.clientHeight || 64;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.fillStyle = '#06090f';
      ctx.fillRect(0, 0, W, H);

      const candles = stock.candles;
      const allP = candles.flatMap(c => [c.h, c.l]).concat([stock.support1, stock.resistance1]);
      const minP = Math.min(...allP) * 0.999;
      const maxP = Math.max(...allP) * 1.001;
      const span = Math.max(maxP - minP, 0.01);

      const mapX = i => 4 + (i / (candles.length - 1)) * (W - 8);
      const mapY = p => H - 4 - ((p - minP) / span) * (H - 8);

      // Shaded OB1 & OB2 Zones
      const fillCol = stock.isBull ? 'rgba(0,230,118,0.18)' : 'rgba(255,59,92,0.20)';
      const strokeCol = stock.isBull ? 'rgba(0,230,118,0.6)' : 'rgba(255,59,92,0.6)';
      [stock.ob1, stock.ob2].forEach(ob => {
        const x = mapX(ob.startIdx);
        const y = mapY(ob.high);
        const bh = Math.max(4, mapY(ob.low) - y);
        ctx.fillStyle = fillCol;
        ctx.fillRect(x, y, W - x - 2, bh);
        ctx.strokeStyle = strokeCol;
        ctx.lineWidth = 0.7;
        ctx.strokeRect(x, y, W - x - 2, bh);
      });

      // R1 dotted line
      ctx.save();
      ctx.strokeStyle = 'rgba(255,179,0,0.55)';
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      const r1y = mapY(stock.resistance1);
      ctx.moveTo(0, r1y);
      ctx.lineTo(W, r1y);
      ctx.stroke();
      ctx.restore();

      // Dashed Cyan VWAP
      ctx.save();
      ctx.strokeStyle = 'rgba(0,210,255,0.75)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 2]);
      ctx.beginPath();
      candles.forEach((c, i) => {
        const x = mapX(i), y = mapY(c.vwap);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.restore();

      // Price close curve
      ctx.strokeStyle = stock.isBull ? '#00e676' : '#ff3b5c';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      candles.forEach((c, i) => {
        const x = mapX(i), y = mapY(c.c);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // OB label
      ctx.fillStyle = stock.isBull ? '#00e676' : '#ff3b5c';
      ctx.font = 'bold 8px "JetBrains Mono", monospace';
      ctx.fillText('OB ZONE', mapX(stock.ob2.startIdx) + 3, Math.max(10, mapY(stock.ob2.high) - 2));
    }

    /* -------------------------------------------------------------------------
       G. RENDER MIDDLE GRIDS & RIGHT HIGH-CONVICTION PANEL

    /* -------------------------------------------------------------------------
       H. LEFT PANEL: INTRADAY LIQUIDITY FLOW SPIDER CANVAS
       ------------------------------------------------------------------------- */
    let spiderHitList = [];

    function drawSpiderChart() {
      const wrap = document.getElementById('spiderWrap');
      const canvas = document.getElementById('spiderCanvas');
      if (!wrap || !canvas) return;

      const rect = wrap.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const W = Math.max(300, rect.width);
      const H = Math.max(420, rect.height);

      if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
      }

      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Clear background
      ctx.fillStyle = '#06090f';
      ctx.fillRect(0, 0, W, H);

      const stocks = state.stocks.slice(0, 40);
      const topOscH = 38;
      const leftPad = 10;
      const rightLabelsW = 86;   // Ranked ticker labels on right edge
      const depthBarW = 22;      // Stacked vertical Liquidity Depth Bar
      const bezierW = 36;        // Glowing Bezier curves
      const chartLeft = leftPad;
      const chartRight = Math.max(120, W - rightLabelsW - depthBarW - bezierW - 8);
      const chartW = chartRight - chartLeft;
      const chartTop = topOscH + 12;
      const chartBottom = H - 22;
      const chartH = chartBottom - chartTop;

      const allVals = stocks.flatMap(s => s.trajectory);
      const maxPos = Math.max(5.5, ...allVals) * 1.08;
      const minNeg = Math.min(-3.0, ...allVals) * 1.12;
      const span = Math.max(0.5, maxPos - minNeg);
      const zeroY = chartTop + (maxPos / span) * chartH;

      const mapY = v => chartTop + ((maxPos - v) / span) * chartH;

      // 1. Subtle horizontal gridlines
      ctx.strokeStyle = 'rgba(28, 38, 56, 0.55)';
      ctx.lineWidth = 1;
      [6, 4, 2, -1, -2, -3].forEach(lvl => {
        if (lvl < maxPos && lvl > minNeg) {
          const y = mapY(lvl);
          ctx.beginPath();
          ctx.moveTo(chartLeft, y);
          ctx.lineTo(chartRight, y);
          ctx.stroke();
        }
      });

      // Vertical time ticks (09:15 -> current)
      const timeMarks = ['09:15', '10:45', '12:15', '13:45', state.mode === 'MCP' ? state.lastMcpUpdate.slice(0, 5) : '15:15'];
      timeMarks.forEach((lbl, idx) => {
        const x = chartLeft + (idx / (timeMarks.length - 1)) * chartW;
        ctx.strokeStyle = 'rgba(28, 38, 56, 0.45)';
        ctx.beginPath();
        ctx.moveTo(x, chartTop);
        ctx.lineTo(x, chartBottom);
        ctx.stroke();
        ctx.fillStyle = '#64748b';
        ctx.font = '9px "JetBrains Mono", monospace';
        ctx.textAlign = idx === 0 ? 'left' : (idx === timeMarks.length - 1 ? 'right' : 'center');
        ctx.fillText(lbl, x, H - 7);
      });

      // 2. Top Mini Net-Flow Breadth Oscillator Bar
      ctx.fillStyle = '#090f1b';
      ctx.fillRect(0, 0, W, topOscH);
      ctx.strokeStyle = '#1c2638';
      ctx.beginPath();
      ctx.moveTo(0, topOscH);
      ctx.lineTo(W, topOscH);
      ctx.stroke();

      const oscMid = topOscH / 2;
      const refLen = Math.max(2, stocks[0]?.trajectory.length || 2);
      ctx.beginPath();
      for (let i = 0; i < refLen; i++) {
        const x = chartLeft + (i / (refLen - 1)) * chartW;
        let bSum = 0, sSum = 0;
        for (const s of stocks) {
          const val = s.trajectory[Math.min(i, s.trajectory.length - 1)] || 0;
          if (val >= 0) bSum += val; else sSum += Math.abs(val);
        }
        const net = (bSum - sSum) / Math.max(1, bSum + sSum);
        const y = oscMid - net * (topOscH * 0.36);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const bullTotal = stocks.filter(s => s.isBull).length;
      const bearTotal = stocks.length - bullTotal;
      const bullRatio = bullTotal / Math.max(1, stocks.length);

      ctx.font = 'bold 9px "JetBrains Mono", monospace';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#00e676';
      ctx.fillText(`NET BULL ${(bullRatio * 100).toFixed(0)}%`, W - 10, 15);
      ctx.fillStyle = '#64748b';
      ctx.fillText('BREADTH OSC', W - 10, 29);

      // 3. Zero Baseline
      ctx.save();
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.5)';
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(chartLeft, zeroY);
      ctx.lineTo(W - 6, zeroY);
      ctx.stroke();
      ctx.restore();

      // 4. Up to 40 Glowing Trajectories
      const q = state.searchQuery.trim().toUpperCase();
      spiderHitList = [];
      const sortedDraw = [...stocks].sort((a, b) => Math.abs(a.pChange) - Math.abs(b.pChange));

      sortedDraw.forEach(stock => {
        const masterIdx = state.stocks.indexOf(stock);
        const isHov = state.hoveredSpiderIdx === masterIdx;
        const secMatch = state.activeSector === 'ALL' || stock.sector === state.activeSector;
        const qMatch = !q || stock.symbol.includes(q) || stock.sector.includes(q);
        const highlight = isHov || (q && qMatch);
        const dim = !secMatch || (q && !qMatch) || (state.hoveredSpiderIdx >= 0 && !isHov);

        const rgb = stock.isBull ? '0, 230, 118' : '255, 59, 92';
        const alpha = highlight ? 1.0 : (dim ? 0.12 : 0.62);

        ctx.save();
        if (highlight) {
          ctx.shadowColor = stock.isBull ? '#00e676' : '#ff3b5c';
          ctx.shadowBlur = 10;
        }
        ctx.strokeStyle = `rgba(${rgb}, ${alpha})`;
        ctx.lineWidth = highlight ? 2.3 : 1.15;

        const pts = stock.trajectory;
        ctx.beginPath();
        for (let i = 0; i < pts.length; i++) {
          const x = chartLeft + (i / Math.max(1, pts.length - 1)) * chartW;
          const y = mapY(pts[i]);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();

        spiderHitList.push({ masterIdx, stock, pts });
      });

      // 5. Stacked Vertical Liquidity Depth Bar
      const barX = chartRight + 8;
      const bullBarH = (zeroY - chartTop) * Math.min(0.96, 0.48 + bullRatio * 0.62);
      const bearBarH = (chartBottom - zeroY) * Math.min(0.96, 0.48 + (1 - bullRatio) * 0.62);

      const bGrad = ctx.createLinearGradient(barX, zeroY - bullBarH, barX, zeroY);
      bGrad.addColorStop(0, 'rgba(0, 230, 118, 0.92)');
      bGrad.addColorStop(1, 'rgba(0, 230, 118, 0.16)');
      ctx.fillStyle = bGrad;
      ctx.fillRect(barX, zeroY - bullBarH, depthBarW, bullBarH - 1);
      ctx.strokeStyle = 'rgba(0, 230, 118, 0.7)';
      ctx.strokeRect(barX, zeroY - bullBarH, depthBarW, bullBarH - 1);

      const sGrad = ctx.createLinearGradient(barX, zeroY, barX, zeroY + bearBarH);
      sGrad.addColorStop(0, 'rgba(255, 59, 92, 0.16)');
      sGrad.addColorStop(1, 'rgba(255, 59, 92, 0.92)');
      ctx.fillStyle = sGrad;
      ctx.fillRect(barX, zeroY + 1, depthBarW, bearBarH);
      ctx.strokeStyle = 'rgba(255, 59, 92, 0.7)';
      ctx.strokeRect(barX, zeroY + 1, depthBarW, bearBarH);

      // 6. Glowing Bezier Flow Curves from Depth Bar to Right-Edge Ranked Labels
      const flowX0 = barX + depthBarW;
      const labelX = W - rightLabelsW + 4;
      const cpX1 = flowX0 + bezierW * 0.45;
      const cpX2 = flowX0 + bezierW * 0.65;

      const rankedBulls = stocks.filter(s => s.isBull).sort((a, b) => b.pChange - a.pChange).slice(0, 10);
      const rankedBears = stocks.filter(s => !s.isBull).sort((a, b) => a.pChange - b.pChange).slice(0, 8);

      const bullStep = Math.max(13, (zeroY - chartTop - 10) / Math.max(1, rankedBulls.length));
      rankedBulls.forEach((s, i) => {
        const yTarget = chartTop + 9 + i * bullStep;
        if (yTarget >= zeroY - 6) return;
        const ySrc = (zeroY - bullBarH + 6) + (i / Math.max(1, rankedBulls.length - 1)) * Math.max(8, bullBarH - 14);
        const isHov = state.stocks[state.hoveredSpiderIdx]?.symbol === s.symbol;

        ctx.beginPath();
        ctx.moveTo(flowX0, ySrc);
        ctx.bezierCurveTo(cpX1, ySrc, cpX2, yTarget, labelX - 3, yTarget);
        ctx.strokeStyle = isHov ? '#00e676' : `rgba(0, 230, 118, ${0.22 + (1 - i / 10) * 0.45})`;
        ctx.lineWidth = isHov ? 2 : 1.1;
        ctx.stroke();

        ctx.font = `${isHov ? 'bold ' : ''}8.5px "JetBrains Mono", monospace`;
        ctx.textAlign = 'left';
        ctx.fillStyle = isHov ? '#ffffff' : '#cbd5e1';
        ctx.fillText(s.symbol.slice(0, 8), labelX, yTarget + 3);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#00e676';
        ctx.fillText(`+${s.pChange.toFixed(1)}%`, W - 4, yTarget + 3);
      });

      const bearStep = Math.max(13, (chartBottom - zeroY - 10) / Math.max(1, rankedBears.length));
      rankedBears.forEach((s, i) => {
        const yTarget = zeroY + 13 + i * bearStep;
        if (yTarget > chartBottom) return;
        const ySrc = (zeroY + 8) + (i / Math.max(1, rankedBears.length - 1)) * Math.max(8, bearBarH - 14);
        const isHov = state.stocks[state.hoveredSpiderIdx]?.symbol === s.symbol;

        ctx.beginPath();
        ctx.moveTo(flowX0, ySrc);
        ctx.bezierCurveTo(cpX1, ySrc, cpX2, yTarget, labelX - 3, yTarget);
        ctx.strokeStyle = isHov ? '#ff3b5c' : `rgba(255, 59, 92, ${0.22 + (1 - i / 8) * 0.45})`;
        ctx.lineWidth = isHov ? 2 : 1.1;
        ctx.stroke();

        ctx.font = `${isHov ? 'bold ' : ''}8.5px "JetBrains Mono", monospace`;
        ctx.textAlign = 'left';
        ctx.fillStyle = isHov ? '#ffffff' : '#cbd5e1';
        ctx.fillText(s.symbol.slice(0, 8), labelX, yTarget + 3);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ff3b5c';
        ctx.fillText(`${s.pChange.toFixed(1)}%`, W - 4, yTarget + 3);
      });

      document.getElementById('spiderBullPct').textContent = `${(bullRatio * 100).toFixed(1)}% BULL`;
      document.getElementById('spiderBearPct').textContent = `${((1 - bullRatio) * 100).toFixed(1)}% BEAR`;
    }

    function bindSpiderEvents() {
      const canvas = document.getElementById('spiderCanvas');
      const tooltip = document.getElementById('spiderTooltip');

      canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        const leftPad = 10;
        const chartRight = Math.max(120, rect.width - 86 - 22 - 36 - 8);
        const chartW = chartRight - leftPad;
        const chartTop = 50;
        const chartBottom = rect.height - 22;
        const chartH = chartBottom - chartTop;

        const allVals = state.stocks.slice(0, 40).flatMap(s => s.trajectory);
        const maxPos = Math.max(5.5, ...allVals) * 1.08;
        const minNeg = Math.min(-3.0, ...allVals) * 1.12;
        const span = Math.max(0.5, maxPos - minNeg);

        const normX = Math.max(0, Math.min(1, (mx - leftPad) / Math.max(1, chartW)));

        let bestDist = 18;
        let bestIdx = -1;
        for (const item of spiderHitList) {
          const bi = Math.round(normX * Math.max(0, item.pts.length - 1));
          const py = chartTop + ((maxPos - item.pts[bi]) / span) * chartH;
          const d = Math.abs(my - py);
          if (d < bestDist) {
            bestDist = d;
            bestIdx = item.masterIdx;
          }
        }

        if (bestIdx !== state.hoveredSpiderIdx) {
          state.hoveredSpiderIdx = bestIdx;
          drawSpiderChart();
        }

        if (bestIdx >= 0) {
          const s = state.stocks[bestIdx];
          document.getElementById('ttSym').textContent = s.symbol;
          const pctEl = document.getElementById('ttPct');
          pctEl.textContent = fmtPct(s.pChange);
          pctEl.className = s.isBull ? 'bull-txt' : 'bear-txt';
          document.getElementById('ttSec').textContent = s.sector;
          document.getElementById('ttLtp').textContent = `₹${fmtPrice(s.ltp)}`;
          document.getElementById('ttVol').textContent = s.strengthLabel;

          tooltip.classList.add('visible');
          tooltip.style.left = `${Math.min(rect.width - 170, Math.max(8, mx + 14))}px`;
          tooltip.style.top = `${Math.min(rect.height - 76, Math.max(44, my - 20))}px`;
        } else {
          tooltip.classList.remove('visible');
        }
      });

      canvas.addEventListener('mouseleave', () => {
        state.hoveredSpiderIdx = -1;
        tooltip.classList.remove('visible');
        drawSpiderChart();
      });

      canvas.addEventListener('click', () => {
        if (state.hoveredSpiderIdx >= 0) {
          openOrderBlockModal(state.stocks[state.hoveredSpiderIdx].symbol);
        }
      });
    }

    /* -------------------------------------------------------------------------
       I. INTERACTIVE ORDER BLOCK 5m CANDLESTICK MODAL
       ------------------------------------------------------------------------- */
    function openOrderBlockModal(symbol) {
      const stock = state.stocks.find(s => s.symbol === symbol);
      if (!stock) return;

    function drawModalChart(stock) {
      const canvas = document.getElementById('modalCanvas');
      if (!canvas) return;
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const W = Math.max(320, rect.width - 16);
      const H = Math.max(344, rect.height - 16);

      if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
      }

      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.fillStyle = '#06090f';
      ctx.fillRect(0, 0, W, H);

      const padL = 12, padR = 78, padT = 38, padB = 26, volH = 56;
      const priceB = H - padB - volH;
      const priceH = priceB - padT;
      const plotW = W - padL - padR;

      const candles = stock.candles;
      const allP = candles.flatMap(c => [c.h, c.l, c.vwap]).concat([stock.support1, stock.resistance1, stock.resistance2]);
      const minP = Math.min(...allP);
      const maxP = Math.max(...allP);
      const padP = (maxP - minP) * 0.08;
      const yMin = minP - padP;
      const yMax = maxP + padP;
      const ySpan = Math.max(yMax - yMin, 0.01);
      const maxV = Math.max(...candles.map(c => c.v), 1);

      const stepX = plotW / candles.length;
      const mapX = i => padL + i * stepX + stepX / 2;
      const mapY = p => padT + ((yMax - p) / ySpan) * priceH;

      // Gridlines & Y-axis
      ctx.strokeStyle = 'rgba(28, 38, 56, 0.65)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 6; i++) {
        const p = yMin + (i / 6) * ySpan;
        const y = mapY(p);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = '10px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(p.toFixed(2), W - padR + 6, y + 3);
      }

      // Time ticks
      for (let i = 0; i < candles.length; i += 9) {
        const x = mapX(i);
        ctx.strokeStyle = 'rgba(28, 38, 56, 0.45)';
        ctx.beginPath();
        ctx.moveTo(x, padT);
        ctx.lineTo(x, H - padB);
        ctx.stroke();
        ctx.fillStyle = '#64748b';
        ctx.font = '9.5px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(candles[i].time, x, H - 8);
      }

      // Shaded Morning OB & Midday OB zones
      [stock.ob1, stock.ob2].forEach(ob => {
        const x0 = mapX(ob.startIdx) - stepX * 0.4;
        const yTop = mapY(ob.high);
        const yBot = mapY(ob.low);
        const bh = Math.max(10, yBot - yTop);
        ctx.fillStyle = stock.isBull ? 'rgba(0, 230, 118, 0.14)' : 'rgba(255, 59, 92, 0.15)';
        ctx.fillRect(x0, yTop, (W - padR) - x0, bh);
        ctx.strokeStyle = stock.isBull ? 'rgba(0, 230, 118, 0.62)' : 'rgba(255, 59, 92, 0.62)';
        ctx.strokeRect(x0, yTop, (W - padR) - x0, bh);

        ctx.fillStyle = stock.isBull ? '#00e676' : '#ff3b5c';
        ctx.font = 'bold 9.5px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`${ob.label}: ${ob.low.toFixed(2)} - ${ob.high.toFixed(2)}`, x0 + 6, yTop - 4);
      });

      // Dotted R2, R1, S1 with right-axis badges
      const drawLvl = (p, lbl, col) => {
        const y = mapY(p);
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = col;
        ctx.fillRect(W - padR + 2, y - 8, padR - 4, 15);
        ctx.fillStyle = '#06090f';
        ctx.font = 'bold 9px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`${lbl} ${p.toFixed(1)}`, W - padR + 5, y + 3);
      };
      drawLvl(stock.resistance2, 'R2', '#ffb300');
      drawLvl(stock.resistance1, 'R1', '#f59e0b');
      drawLvl(stock.support1, 'S1', '#00d2ff');

      // Volume histogram
      candles.forEach((c, i) => {
        const x = mapX(i);
        const bw = Math.max(2, stepX * 0.62);
        const h = (c.v / maxV) * (volH - 8);
        ctx.fillStyle = c.c >= c.o ? 'rgba(0, 230, 118, 0.28)' : 'rgba(255, 59, 92, 0.28)';
        ctx.fillRect(x - bw / 2, H - padB - h, bw, h);
      });

      // Candlesticks
      candles.forEach((c, i) => {
        const x = mapX(i);
        const bw = Math.max(2.5, stepX * 0.62);
        const col = c.c >= c.o ? '#00e676' : '#ff3b5c';
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(x, mapY(c.h));
        ctx.lineTo(x, mapY(c.l));
        ctx.stroke();

        const yO = mapY(c.o), yC = mapY(c.c);
        ctx.fillStyle = col;
        ctx.fillRect(x - bw / 2, Math.min(yO, yC), bw, Math.max(1.5, Math.abs(yC - yO)));
      });

      // Dashed cyan VWAP
      ctx.save();
      ctx.strokeStyle = '#00d2ff';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([5, 3]);
      ctx.beginPath();
      candles.forEach((c, i) => {
        const x = mapX(i), y = mapY(c.vwap);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.restore();

      // Interactive Crosshair
      if (state.modalMouse.inside) {
        const mx = Math.max(padL, Math.min(W - padR, state.modalMouse.x));
        const my = Math.max(padT, Math.min(H - padB, state.modalMouse.y));
        const idx = Math.max(0, Math.min(candles.length - 1, Math.floor((mx - padL) / stepX)));
        const hc = candles[idx];
        const snapX = mapX(idx);

        ctx.save();
        ctx.strokeStyle = 'rgba(226, 232, 240, 0.45)';
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(snapX, padT);
        ctx.lineTo(snapX, H - padB);
        ctx.moveTo(padL, my);
        ctx.lineTo(W - padR, my);
        ctx.stroke();
        ctx.restore();

        if (my <= priceB) {
          const hp = yMax - ((my - padT) / priceH) * ySpan;
          ctx.fillStyle = '#111a2a';
          ctx.fillRect(W - padR + 2, my - 8, padR - 4, 16);
          ctx.strokeStyle = '#00d2ff';
          ctx.strokeRect(W - padR + 2, my - 8, padR - 4, 16);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 9.5px "JetBrains Mono", monospace';
          ctx.textAlign = 'left';
          ctx.fillText(hp.toFixed(2), W - padR + 6, my + 3);
        }

        ctx.fillStyle = '#111a2a';
        ctx.fillRect(snapX - 20, H - padB + 2, 40, 16);
        ctx.fillStyle = '#00d2ff';
        ctx.font = 'bold 9.5px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(hc.time, snapX, H - padB + 13);

        updateHud(hc);
      }
    }

    function bindModalEvents() {
      const canvas = document.getElementById('modalCanvas');
      const onMove = (cx, cy) => {
        if (!state.activeModalSymbol) return;
        const rect = canvas.getBoundingClientRect();
        state.modalMouse = { x: cx - rect.left, y: cy - rect.top, inside: true };
        const s = state.stocks.find(st => st.symbol === state.activeModalSymbol);
        if (s) drawModalChart(s);
      };
      canvas.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
      canvas.addEventListener('touchmove', e => {
        if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      canvas.addEventListener('mouseleave', () => {
        state.modalMouse.inside = false;
        const s = state.stocks.find(st => st.symbol === state.activeModalSymbol);
        if (s) {
          updateHud(s.candles[s.candles.length - 1]);
          drawModalChart(s);
        }
      });

      document.getElementById('closeModalBtn').addEventListener('click', closeOrderBlockModal);
      document.getElementById('obModal').addEventListener('click', e => {
        if (e.target.id === 'obModal') closeOrderBlockModal();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && state.activeModalSymbol) closeOrderBlockModal();
      });
    }

    /* -------------------------------------------------------------------------
       J. LIVE NSE MCP BRIDGE INTEGRATION & SIMULATION ENGINE
       ------------------------------------------------------------------------- */
    function updateModeUI() {
      const btnMcp = document.getElementById('btnLiveMcp');
      const btnSim = document.getElementById('btnSimMode');

      const txt = document.getElementById('statusText');

    function seedInitialLiveCurve(symbol, targetPct, stampHM) {
      const rand = seededRand(symbol + '_LIVE_SEED');
      const steps = 16;
      const pts = [];
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const wiggle = (i === 0 || i === steps - 1) ? 0 : (rand() - 0.5) * Math.max(0.25, Math.abs(targetPct) * 0.14);
        const val = i === 0 ? 0 : (i === steps - 1 ? targetPct : Number((targetPct * eased + wiggle).toFixed(2)));
        pts.push({ time: i === 0 ? '09:15' : stampHM, pct: val });
      }
      return pts;
    }

    async function pollMcpBridge(isManualTest = false) {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 5500);
        const res = await fetch(state.bridgeUrl, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(timeout);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const payload = await res.json();
        if (!payload || !Array.isArray(payload.stocks) || payload.stocks.length === 0) {
          throw new Error('Bridge responded with empty stocks array');
        }

        const stamp = payload.updated_at || getIstTimeStr();
        const stampHM = stamp.slice(0, 5);
        state.mcpConnected = true;
        state.lastMcpUpdate = stamp;

        // Seed smooth 09:15 -> current curve on first load, then append live polls
        const built = payload.stocks.map(raw => {
          const sym = String(raw.symbol || '').trim().toUpperCase();
          const pct = Number(raw.pChange || 0);
          if (!state.liveHistory[sym]) {
            state.liveHistory[sym] = seedInitialLiveCurve(sym, pct, stampHM);
          } else {
            const hist = state.liveHistory[sym];
            const last = hist[hist.length - 1];
            if (!last || last.time !== stampHM || last.pct !== pct) {
              hist.push({ time: stampHM, pct });
              if (hist.length > 140) hist.shift();
            }
          }
          return buildStockObject(raw, state.liveHistory[sym]);
        });

        state.stocks = built;
        updateModeUI();
        renderAll();

        if (isManualTest) {
          showToast(`Connected to NSE MCP Bridge (${built.length} stocks @ ${stamp})`, 'success');
        }
        return { ok: true, count: built.length, stamp };
      } catch (err) {
        state.mcpConnected = false;
        updateModeUI();
        if (isManualTest) {
          showToast(`Bridge unreachable: run uvicorn nse_mcp_bridge:app --port 8000`, 'warn');
        }
        return { ok: false, error: err.message };
      }
    }

    function tickSimulation() {
      // Only run simulation ticks when in SIM mode or when MCP is offline (seamless fallback)
      if (state.mode === 'MCP' && state.mcpConnected) return;

      state.stocks.forEach(s => {
        const drift = (Math.random() - 0.485) * 0.15;
        s.pChange = Number((s.pChange + drift).toFixed(2));
        s.ltp = Number((s.prevClose * (1 + s.pChange / 100)).toFixed(2));
        s.high = Math.max(s.high, s.ltp);
        s.low = Math.min(s.low, s.ltp);
        s.pointChange = s.ltp - s.prevClose;
        s.isBull = s.pChange >= 0;
        s.buildUp = s.isBull ? 'LONG BUILD-UP' : 'SHORT BUILD-UP';
        if (s.hasRealVol) {
          s.volRatio = Math.max(0.8, Number((s.volRatio + (Math.random() - 0.48) * 0.05).toFixed(2)));
          s.compactStrength = `${s.volRatio.toFixed(2)}x VOL`;
          s.strengthLabel = s.compactStrength;
        }
        s.vwapDiffPct = ((s.ltp - s.vwap) / Math.max(0.01, s.vwap)) * 100;
        s.conviction = computeConviction(s.pChange, s.volRatio, s.ltp, s.vwap, s.high, s.low, s.volume);

        const last = s.candles[s.candles.length - 1];
        last.c = s.ltp;
        last.h = Math.max(last.h, s.ltp);
        last.l = Math.min(last.l, s.ltp);
        last.v += Math.round(Math.random() * 14000);
        s.trajectory[s.trajectory.length - 1] = s.pChange;
      });

      renderAll();
    }

    function setMode(newMode) {
      state.mode = newMode;
      clearInterval(state.mcpTimer);

      if (newMode === 'MCP') {
        updateModeUI();
        pollMcpBridge(true);
        state.mcpTimer = setInterval(() => pollMcpBridge(false), state.pollIntervalSec * 1000);
      } else {
        state.mcpConnected = false;
        updateModeUI();
        showToast('Switched to SIM MODE (2s intraday simulation)', 'info');
      }
    }

    /* -------------------------------------------------------------------------
       K. NSE CSV UPLOAD & SAMPLE CSV DOWNLOAD
       ------------------------------------------------------------------------- */
    function handleCsvUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const text = String(ev.target.result || '').trim();
          const lines = text.split(/\r?\n/).filter(Boolean);
          if (lines.length < 2) throw new Error('CSV needs a header row and at least one stock row.');

          const hdrs = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/[^a-z0-9%]/g, ''));
          const iSym = hdrs.findIndex(h => h.includes('symbol') || h.includes('ticker'));
          const iLtp = hdrs.findIndex(h => h.includes('ltp') || h.includes('close') || h.includes('last'));
          const iPct = hdrs.findIndex(h => h.includes('chg') || h.includes('change') || h.includes('%') || h.includes('pct'));
          const iVol = hdrs.findIndex(h => h.includes('vol') || h.includes('tottrdqty'));
          const iSec = hdrs.findIndex(h => h.includes('sector'));
          const iVwap = hdrs.findIndex(h => h.includes('vwap'));

          if (iSym === -1 || iLtp === -1) {
            throw new Error('Required columns: Symbol and Close/LTP.');
          }

          const imported = [];
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const symbol = (cols[iSym] || '').toUpperCase();
            const ltp = parseFloat(cols[iLtp]);
            if (!symbol || isNaN(ltp) || ltp <= 0) continue;

            const pChange = iPct >= 0 ? (parseFloat((cols[iPct] || '0').replace('%', '')) || 0) : 0;
            const volume = iVol >= 0 ? (parseInt((cols[iVol] || '2000000').replace(/[^0-9]/g, ''), 10) || 2000000) : 2000000;
            const sector = iSec >= 0 ? cols[iSec] : 'BANKING';
            const vwap = iVwap >= 0 ? parseFloat(cols[iVwap]) : undefined;

            imported.push(buildStockObject({ symbol, sector, ltp, pChange, volume, vwap }));
          }

          if (!imported.length) throw new Error('No valid rows parsed.');
          state.stocks = imported;
          state.activeSector = 'ALL';
          renderAll();
          showToast(`Imported ${imported.length} NSE stocks from ${file.name}`, 'success');
        } catch (err) {
          showToast(`CSV Error: ${err.message}`, 'error');
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsText(file);
    }

        testBox.textContent = 'Testing connection...';
        const res = await pollMcpBridge(false);
        if (res.ok) {
          testBox.style.background = 'rgba(0, 230, 118, 0.14)';
          testBox.style.color = '#00e676';
          testBox.textContent = `CONNECTED: ${res.count} stocks received @ ${res.stamp}`;
        } else {
          testBox.style.background = 'rgba(255, 59, 92, 0.14)';
          testBox.style.color = '#ff8096';
          testBox.textContent = `OFFLINE (${res.error}). Run: uvicorn nse_mcp_bridge:app --port 8000`;
        }
      });

      // CSV controls
      document.getElementById('csvUploadInput').addEventListener('change', handleCsvUpload);
      document.getElementById('sampleCsvBtn').addEventListener('click', downloadSampleCsv);

      // Responsive Canvas Redraws
      const ro = new ResizeObserver(() => {
        drawSpiderChart();
        renderHighConvictionPicks();
        if (state.activeModalSymbol) {
          const s = state.stocks.find(st => st.symbol === state.activeModalSymbol);
          if (s) drawModalChart(s);
        }
      });
      ro.observe(document.getElementById('spiderWrap'));
    });
  </script>
</body>
</html>
